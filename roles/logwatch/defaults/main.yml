# defaults/main.yml
logwatch_email: "alext@t7g.org"        # Address for reports
logwatch_detail: "Med"                  # Detail level: Low, Med, High
logwatch_archive: "No"                  # Whether to archive old reports

# MTA (postfix) configuration
postfix_install: true                   # Install and configure postfix
postfix_type: "Internet Site"           # Internet Site / Satellite / Local only
postfix_relayhost: ""                   # Set smtp:[mail.example.com]:587 if a relay is needed
postfix_myorigin: "localhost"           # Envelope sender address
