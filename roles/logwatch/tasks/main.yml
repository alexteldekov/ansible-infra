---
- name: Ensure debconf-utils is installed (for non-interactive postfix configuration)
  ansible.builtin.apt:
    name: debconf-utils
    state: present
    update_cache: true

- name: Set debconf values for postfix (when used)
  when: postfix_install
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: "postfix/main_mailer_type", value: "{{ postfix_type }}", vtype: "string" }
    - { question: "postfix/mailname", value: "{{ ansible_hostname }}{{ '.' + ansible_domain if ansible_domain is defined else '' }}", vtype: "string" }
    - { question: "postfix/relayhost", value: "{{ postfix_relayhost }}", vtype: "string" }
    - { question: "postfix/myorigin", value: "{{ postfix_myorigin }}", vtype: "string" }
    - { question: "postfix/protocols", value: "ipv4", vtype: "select" }

- name: Install required packages (logwatch + MTA)
  ansible.builtin.apt:
    name:
      - logwatch
      - postfix
#      - mailutils          # mail utility for testing, optional
    state: present
    update_cache: true
  when: postfix_install

- name: Install only logwatch when postfix is not required
  ansible.builtin.apt:
    name: logwatch
    state: present
    update_cache: true
  when: not postfix_install

- name: Explicitly set inet_protocols = ipv4 in main.cf
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^inet_protocols\s*='
    line: 'inet_protocols = ipv4'
    state: present
  when: postfix_install
  notify: restart postfix

- name: Ensure postfix is started and enabled (when installed)
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true
  when: postfix_install

- name: Configure root mail forwarding via /etc/aliases
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: '^root:'
    line: "root: {{ logwatch_email }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: rebuild aliases

- name: Create custom logwatch configuration (overrides defaults)
  ansible.builtin.template:
    src: logwatch_override.conf.j2
    dest: /etc/logwatch/conf/override.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    mailto: "root"           # send to root, which is forwarded via aliases
  notify: restart logwatch cron
