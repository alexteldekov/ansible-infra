---
# OpenVPN server configuration defaults

# Network topology
openvpn_protocol: tcp
openvpn_port: 443
openvpn_topology: subnet
openvpn_network: 10.8.2.0
openvpn_netmask: 255.255.255.0

# IPv6 в туннеле: сервер выдаёт клиентам ULA-подсеть, на выходе NAT66 (MASQUERADE),
# IPv6-маршруты сервисов пушатся как route-ipv6. Выключите, если на сервере
# нет IPv6-связности.
openvpn_ipv6_enabled: false
openvpn_ipv6_prefix: fd00:10:8:2::/64

# Route pushed to clients (home network behind the VPN server)
home_network: 192.168.0.0
home_netmask: 255.255.0.0

# Скрипт обновления routes.inc (запускается по таймеру systemd)
openvpn_routes_script: /usr/local/sbin/update_openvpn_routes.py
openvpn_routes_inc: "{{ openvpn_config_dir }}/routes.inc"
# Российские исключения (net_gateway) — отдельный файл: включается только
# в CCD mobile-клиентов через config. push-remove net_gateway из CCD не
# работает: OpenVPN матчит push-remove по префиксу, а не по подстроке
openvpn_routes_ru_inc: "{{ openvpn_config_dir }}/routes-ru.inc"
openvpn_routes_custom_list: "{{ openvpn_config_dir }}/routes_custom.lst"
# Подключать ли список antifilter (18+ тыс. маршрутов — клиенты могут захлебнуться)
openvpn_antifilter_enabled: false
openvpn_antifilter_url: https://antifilter.download/list/allyouneed.lst
# Сервисы с iplist.opencck.org, чьи сети добавляются в routes.inc.
# Имена — как на сайте (site=): youtube.com, discord.com, ...
# Упавший батч пропускается, остальные обновляются.
openvpn_iplist_services: []
openvpn_iplist_base_url: https://iplist.opencck.org
# Сколько сервисов запрашивать одним HTTP-запросом (чтобы не забанили за спам)
openvpn_iplist_batch_size: 20
# Включать ли отдельные ip4-адреса сервисов как /32-маршруты.
# Осторожно: у крупных сервисов их десятки тысяч (youtube.com — 22+ тыс.)
openvpn_iplist_include_ip4: false
# То же для IPv6 (ip6 как /128-маршруты route-ipv6)
openvpn_iplist_include_ip6: false
# Исключать российские сети из VPN: российские сети пушатся через net_gateway
# (исходный шлюз клиента) отдельным файлом routes-ru.inc, который включается
# только в CCD mobile-клиентов (redirect-gateway). Роутеры его не получают:
# у них default route и так через провайдера, а Keenetic не умеет net_gateway.
# Сети из сервисов/antifilter/custom не дублируются; ошибка загрузки
# прерывает обновление (старые маршруты сохраняются).
openvpn_russia_exclude_enabled: true
# Порталы-источники российских сетей (russia.iplist.opencck.org), как на сайте:
# yandex.ru, mail.ru, sberbank.ru, ... Запрашиваются батчами, как сервисы
# iplist. Полный каталог (87 порталов) — в комментариях
# inventory/production/group_vars/vpn_servers.yml.
# ПУСТОЙ СПИСОК = российские исключения отключены: из VPN-маршрутов ничего
# не вырезается, routes-ru.inc пуст (инвариант «российский трафик никогда
# через VPN» перестаёт соблюдаться автоматически — выберите порталы).
openvpn_russia_exclude_portals: []
openvpn_russia_exclude_base_url: https://russia.iplist.opencck.org
# IPv6: route-ipv6 на tun не умеет net_gateway, поэтому v6-сети выбранных
# порталов работают фильтром — v6-маршруты, пересекающиеся с ними, не
# пушатся вовсе (клиенты ходят к ним по нативному маршруту провайдера)

# Paths
easyrsa_dir: /etc/openvpn/easyrsa
ccd_dir: /etc/openvpn/ccd
openvpn_config_dir: /etc/openvpn
openvpn_server_name: server

# Client config bundles output directory (on the VPN server)
client_config_dir: /etc/openvpn/client-configs

# Remote endpoint for client configs (host clients connect to)
# IP-адрес, а не DNS-имя: DNS-запрос клиента может быть перехвачен/подменён
openvpn_remote: "{{ ansible_host }}"
openvpn_remote_port: "{{ openvpn_port }}"
openvpn_remote_proto: "{{ openvpn_protocol }}"

# DNS pushed to mobile clients (redirect-gateway)
openvpn_dns_servers:
  - 8.8.8.8
  - 1.1.1.1
openvpn_search_domain: "{{ domain | default('') }}"

# Easy-RSA PKI settings
easyrsa_key_size: 2048
easyrsa_ca_expire: 3650
easyrsa_cert_expire: 3650
easyrsa_crl_expire: 3650
easyrsa_country: RU
easyrsa_province: Moscow
easyrsa_city: Moscow
easyrsa_org: t7g.org
easyrsa_email: admin@t7g.org
easyrsa_ou: IT

# OpenVPN crypto settings
openvpn_cipher: AES-256-GCM
openvpn_auth: SHA256
openvpn_tls_auth_key: /etc/openvpn/ta.key

# Client list — each entry generates a certificate, a CCD file, and a .ovpn bundle
# Two client types are supported:
#
#   type: router  — Keenetic/Netcraze, routes specific subnets, NO default route
#   type: mobile  — iPhone/Tunnelblick, full tunnel, default route via VPN
#
# Optional per-client field ipv6: false — выключить IPv6 для этого клиента
# (убирает v6-адрес туннеля и v6-маршруты через push-remove в CCD).
# Работает только при openvpn_ipv6_enabled: true; включить v6 отдельному
# клиенту при выключенном глобально — нельзя.
#
# openvpn_clients:
#   - name: router1
#     type: router
#     static_ip: 10.8.2.20
#     client_subnet: 192.168.10.0    # subnet behind the router
#     client_netmask: 255.255.255.0
#   - name: iphone-alex
#     type: mobile
#     static_ip: 10.8.2.30
#   - name: gw-lenin
#     type: router
#     static_ip: 10.8.2.6
#     ipv6: false                   # v4-only клиент
openvpn_clients: []

# Whether to enable IP forwarding (required for routing)
openvpn_ip_forward: true
# NAT: подсеть VPN-клиентов для MASQUERADE (должна совпадать с openvpn_network/netmask)
openvpn_nat_subnet: 10.8.2.0/24
