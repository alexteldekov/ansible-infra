---
- name: restart openvpn
  ansible.builtin.service:
    name: openvpn@server
    state: restarted
  when: ansible_service_mgr == 'systemd'
  tags: [openvpn, service]

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: ansible_service_mgr == 'systemd'
  tags: [openvpn, service]
